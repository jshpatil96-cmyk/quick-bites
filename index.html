<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quick Bites</title>
<meta name="theme-color" content="#c8321f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quick Bites">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23c8321f%27/%3E%3Ctext x=%2750%27 y=%2770%27 font-size=%2760%27 text-anchor=%27middle%27%3E%F0%9F%A5%AA%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf1f0;--card:#fff;--ink:#2a1513;--mute:#7a5f5c;--line:#f0cfcb;--acc:#c8321f;--accink:#fff;--red:#c8321f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1211;--card:#251918;--ink:#fbeeed;--mute:#c4a4a0;--line:#432b28;--acc:#d9432e;--red:#ff8272}}
:root[data-theme="dark"]{--bg:#1a1211;--card:#251918;--ink:#fbeeed;--mute:#c4a4a0;--line:#432b28;--acc:#d9432e;--red:#ff8272}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:600 17px/1.35 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:150px;user-select:none;-webkit-user-select:none}
input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{background:var(--acc);color:var(--accink);padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
#hd{font-size:15px;font-weight:700}
h2{margin:0 0 6px;font-size:18px}
h3{margin:14px 0 2px;color:var(--acc)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 4px}
.chip{flex:0 0 auto;min-height:50px;padding:0 18px;border-radius:99px;border:2px solid var(--acc);background:var(--card);color:var(--acc);font-weight:800;font-size:17px}
.chip[aria-pressed=true]{background:var(--acc);color:#fff}
.chip i{font-style:normal;background:var(--acc);color:#fff;border-radius:99px;padding:1px 8px;margin-left:8px;font-size:14px}
.chip[aria-pressed=true] i{background:#fff;color:var(--acc)}
#items{padding:8px 12px;display:grid;gap:10px}
.it{display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 14px;background:var(--card);border:2px solid var(--line);border-radius:14px}
.it:active{background:var(--bg)}
.it.on{border-color:var(--acc)}
.nm{flex:1;min-width:0}
.nm b{font-size:19px;font-weight:700;display:block}
.nm small{color:var(--mute);font-weight:500}
.pr{font-weight:800;font-size:19px}
.bd{min-width:38px;height:38px;border-radius:99px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px}
.minus{width:54px;height:54px;flex:0 0 auto;border-radius:12px;border:2px solid var(--acc);background:var(--card);color:var(--acc);font-size:30px;font-weight:800;line-height:1}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:8px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
#bar{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:62px;padding:0 22px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;font-size:21px;margin-bottom:8px}
nav{display:flex}
nav button{flex:1;min-height:52px;border:0;background:transparent;font-weight:700;font-size:15px;color:var(--mute);border-top:4px solid transparent}
nav button[aria-selected=true]{color:var(--acc);border-top-color:var(--acc)}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:21}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.n{flex:1;min-width:0}
.amt{min-width:64px;text-align:right}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:46px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-size:24px;font-weight:800}
.total{display:flex;justify-content:space-between;font-size:30px;font-weight:800;padding:12px 0}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.pay button{min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:19px}
.pay button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.go{width:100%;min-height:64px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;font-size:22px}
.ghost{min-height:44px;border:2px solid var(--line);background:transparent;border-radius:10px;padding:0 14px;font-weight:700}
.del{color:var(--red)}
.pg{padding:12px;display:grid;gap:12px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
.stat small{color:var(--mute);display:block}
.stat b{font-size:26px}
.empty{color:var(--mute);margin:6px 0}
.add{display:grid;gap:8px}
.add input,.edit input{min-height:48px;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-size:17px}
.edit input{width:88px}
details{border-bottom:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:700;display:flex;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
.toast.on{opacity:1}
[hidden]{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>Quick Bites</h1><span id="hd"></span></header>

<section id="order"><div id="chips"></div><div id="items"></div></section>

<section id="sales" class="pg" hidden>
  <div class="stats">
    <div class="stat"><small>Sales</small><b id="s1"></b></div>
    <div class="stat"><small>Orders</small><b id="s2"></b></div>
    <div class="stat"><small>Cash</small><b id="s3"></b></div>
    <div class="stat"><small>UPI</small><b id="s4"></b></div>
  </div>
  <div class="panel"><h2>Items sold</h2><div id="sold"></div></div>
  <div class="panel"><h2>Orders</h2><div id="orders"></div></div>
  <button class="go" id="close">Close day &amp; save report</button>
  <p class="empty">Sales keep adding up until you close the day, even after midnight.</p>
</section>

<section id="reports" class="pg" hidden>
  <div class="panel"><h2>Saved reports</h2><div id="rlist"></div></div>
</section>

<section id="menu" class="pg" hidden>
  <div class="panel">
    <h2>Add item</h2>
    <div class="add">
      <input id="nn" placeholder="Item name" aria-label="Item name">
      <input id="np" type="number" inputmode="numeric" min="0" placeholder="Price ₹" aria-label="Price in rupees">
      <input id="nc" list="cats" placeholder="Category (e.g. Momos)" aria-label="Category">
      <datalist id="cats"></datalist>
      <button class="go" id="addbtn">Add item</button>
    </div>
  </div>
  <div class="panel"><h2>Menu &amp; prices</h2><div id="mlist"></div></div>
</section>

<div class="dock">
  <button id="bar" hidden></button>
  <nav role="tablist">
    <button role="tab" data-t="order" aria-selected="true">Order</button>
    <button role="tab" data-t="sales" aria-selected="false">Sales</button>
    <button role="tab" data-t="reports" aria-selected="false">Reports</button>
    <button role="tab" data-t="menu" aria-selected="false">Menu</button>
  </nav>
</div>
<div id="shade" hidden></div>
<div id="sheet" role="dialog" aria-label="Current order" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var K="quickbites.v2";
  function M(c,a){return{c:c,items:a.map(function(x){return{n:x[0],p:x[1],note:x[2]||""}})}}
  var def={menu:[
    M("Sandwich",[["Veg Grilled Sandwich",60],["Veg Cheese Grilled Sandwich",70]]),
    M("Potato Spiral",[["Peri Peri Spiral with Mayo",50],["Peri Peri Spiral with Cheese",60]]),
    M("Momos",[["Veg Steam Momos",50],["Veg Fried Momos",60],["Kurkure Momos",80]]),
    M("Fries",[["Salted French Fries",60],["Peri Peri French Fries",70],["Loaded French Fries",80,"Sauce: Tandoori / Cheese / Mayo / Ketchup"]]),
    M("Softy",[["Vanilla Softy",30],["Chocolate Softy",40],["Vanilla + Chocolate Softy",40]]),
    M("Maggi",[["Plain Maggi",40],["Masala Maggi",50],["Cheese Maggi",60]]),
    M("Drinks",[["Coke",30],["Coke Float",60],["Cold Coffee with Crush",60],["Cold Coffee",50],["Cold Coffee with Icecream",70],["Iced Coffee",50]])
  ],orders:[],reports:[]};
  var S;
  try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}
  if(!S||!S.menu)S=def;
  S.orders=S.orders||[];S.reports=S.reports||[];
  var cart={},cur=0,method="Cash",tab="order";

  function $(i){return document.getElementById(i)}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function rs(n){return "₹"+Number(n).toLocaleString("en-IN")}
  function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
  function toast(m){var t=$("toast");t.textContent=m;t.className="toast on";setTimeout(function(){t.className="toast"},1800)}
  function vib(){try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}}
  function itemOf(k){var p=k.split("."),g=S.menu[p[0]];return g&&g.items[p[1]]}
  function keys(){return Object.keys(cart).filter(function(k){return cart[k]>0&&itemOf(k)})}
  function calc(){var n=0,t=0;keys().forEach(function(k){n+=cart[k];t+=cart[k]*itemOf(k).p});return{n:n,t:t}}
  function fmt(t){return new Date(t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}

  function renderChips(){
    if(cur>=S.menu.length)cur=Math.max(0,S.menu.length-1);
    $("chips").innerHTML=S.menu.map(function(g,ci){var c=0;g.items.forEach(function(x,ii){c+=cart[ci+"."+ii]||0});
      return '<button class="chip" data-c="'+ci+'" aria-pressed="'+(ci===cur)+'">'+esc(g.c)+(c?'<i>'+c+'</i>':'')+'</button>'}).join("");
  }
  function renderItems(){
    var g=S.menu[cur];
    $("items").innerHTML=g&&g.items.length?g.items.map(function(m,ii){var k=cur+"."+ii,q=cart[k]||0;
      return '<div class="it'+(q?' on':'')+'" data-k="'+k+'">'+(q?'<button class="minus" aria-label="Remove one '+esc(m.n)+'">−</button>':'')+'<div class="nm"><b>'+esc(m.n)+'</b>'+(m.note?'<small>'+esc(m.note)+'</small>':'')+'</div><span class="pr">'+rs(m.p)+'</span>'+(q?'<span class="bd">'+q+'</span>':'')+'</div>'}).join(""):'<p class="empty">No items. Add some in the Menu tab.</p>';
  }
  function renderBar(){
    var c=calc();$("bar").hidden=!c.n||tab!=="order";
    $("bar").innerHTML='<span>'+c.n+(c.n>1?' items':' item')+'</span><span>'+rs(c.t)+' ›</span>';
  }
  function renderSheet(){
    var ks=keys(),c=calc();
    if(!ks.length){closeSheet();return}
    $("sheet").innerHTML='<div class="row" style="border:0"><h2 style="margin:0;flex:1">Order</h2><button class="ghost" id="sx">Close</button></div>'+
    ks.map(function(k){var m=itemOf(k);return '<div class="row"><span class="n">'+esc(m.n)+'</span><span class="qty"><button data-s="-1" data-k="'+k+'" aria-label="Less '+esc(m.n)+'">−</button><b>'+cart[k]+'</b><button data-s="1" data-k="'+k+'" aria-label="More '+esc(m.n)+'">+</button></span><b class="amt">'+rs(m.p*cart[k])+'</b></div>'}).join("")+
    '<div class="total"><span>Total</span><span>'+rs(c.t)+'</span></div><div class="pay"><button data-m="Cash" aria-pressed="'+(method==="Cash")+'">Cash</button><button data-m="UPI" aria-pressed="'+(method==="UPI")+'">UPI</button></div><button class="go" id="paid">Paid '+rs(c.t)+'</button><button class="ghost" id="clr" style="width:100%;margin-top:10px;min-height:48px">Clear order</button>';
  }
  function openSheet(){$("shade").hidden=false;$("sheet").hidden=false;renderSheet()}
  function closeSheet(){$("shade").hidden=true;$("sheet").hidden=true}
  function paint(){renderChips();renderItems();renderBar();if(!$("sheet").hidden)renderSheet()}

  function renderSales(){
    var tot=0,cash=0,upi=0,cnt={};
    S.orders.forEach(function(o){tot+=o.total;if(o.pay==="UPI")upi+=o.total;else cash+=o.total;o.items.forEach(function(x){cnt[x.n]=(cnt[x.n]||0)+x.q})});
    $("hd").textContent="Today "+rs(tot);
    $("s1").textContent=rs(tot);$("s2").textContent=S.orders.length;$("s3").textContent=rs(cash);$("s4").textContent=rs(upi);
    var k=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]});
    $("sold").innerHTML=k.length?k.map(function(n){return '<div class="row"><span class="n">'+esc(n)+'</span><b>× '+cnt[n]+'</b></div>'}).join(""):'<p class="empty">No sales yet.</p>';
    $("orders").innerHTML=S.orders.length?S.orders.map(function(o,i){return '<div class="row"><span class="n">#'+o.no+' · '+o.time+'<br><small style="color:var(--mute)">'+o.items.map(function(x){return esc(x.n)+' ×'+x.q}).join(", ")+'</small></span><span>'+o.pay+'</span><b>'+rs(o.total)+'</b><button class="ghost del" data-o="'+i+'" aria-label="Delete order '+o.no+'">✕</button></div>'}).reverse().join(""):'<p class="empty">Saved orders will show up here.</p>';
  }
  function renderReports(){
    $("rlist").innerHTML=S.reports.length?S.reports.slice().reverse().map(function(r){
      var it=Object.keys(r.items).map(function(n){return '<div class="row"><span class="n">'+esc(n)+'</span><b>× '+r.items[n]+'</b></div>'}).join("");
      return '<details><summary><span>'+fmt(r.from)+' to '+fmt(r.to)+'</span><span>'+rs(r.total)+'</span></summary><div class="row"><span class="n">Orders</span><b>'+r.count+'</b></div><div class="row"><span class="n">Cash</span><b>'+rs(r.cash)+'</b></div><div class="row"><span class="n">UPI</span><b>'+rs(r.upi)+'</b></div>'+it+'<button class="ghost del" data-r="'+r.id+'" style="margin-top:8px">Delete report</button></details>'
    }).join(""):'<p class="empty">No reports yet. Close a day in the Sales tab to save one.</p>';
  }
  function renderMenu(){
    $("mlist").innerHTML=S.menu.map(function(g,ci){return '<h3>'+esc(g.c)+'</h3>'+g.items.map(function(m,ii){return '<div class="row edit"><span class="n">'+esc(m.n)+'</span><input type="number" inputmode="numeric" min="0" value="'+m.p+'" data-p="'+ci+'.'+ii+'" aria-label="Price for '+esc(m.n)+'"><button class="ghost del" data-x="'+ci+'.'+ii+'">Remove</button></div>'}).join("")}).join("")||'<p class="empty">Menu is empty. Add an item above.</p>';
    $("cats").innerHTML=S.menu.map(function(g){return '<option value="'+esc(g.c)+'">'}).join("");
  }

  function saveOrder(){
    var items=[],t=0;
    keys().forEach(function(k){var m=itemOf(k),q=cart[k];items.push({n:m.n,q:q,p:m.p});t+=m.p*q});
    if(!items.length)return;
    var no=S.orders.length?S.orders[S.orders.length-1].no+1:1;
    S.orders.push({no:no,items:items,total:t,pay:method,time:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}),at:Date.now()});
    save();cart={};method="Cash";closeSheet();paint();renderSales();vib();toast("Order #"+no+" saved · "+rs(t));
  }

  $("chips").onclick=function(e){var b=e.target.closest("[data-c]");if(!b)return;cur=Number(b.dataset.c);paint()};
  $("items").onclick=function(e){
    var it=e.target.closest(".it");if(!it)return;var k=it.dataset.k;
    cart[k]=e.target.closest(".minus")?Math.max(0,(cart[k]||0)-1):(cart[k]||0)+1;
    vib();paint();
  };
  $("bar").onclick=openSheet;
  $("shade").onclick=closeSheet;
  $("sheet").onclick=function(e){
    var t=e.target,s=t.closest("[data-s]");
    if(s){var k=s.dataset.k;cart[k]=Math.max(0,(cart[k]||0)+Number(s.dataset.s));vib();paint();return}
    var m=t.closest("[data-m]");if(m){method=m.dataset.m;renderSheet();return}
    if(t.closest("#sx")){closeSheet();return}
    if(t.closest("#clr")){cart={};closeSheet();paint();return}
    if(t.closest("#paid"))saveOrder();
  };
  $("orders").onclick=function(e){
    var b=e.target.closest("[data-o]");if(!b)return;var i=Number(b.dataset.o),o=S.orders[i];
    if(o&&confirm("Delete order #"+o.no+"?")){S.orders.splice(i,1);save();renderSales()}
  };
  $("close").onclick=function(){
    if(!S.orders.length){toast("No orders to save yet");return}
    if(!confirm("Save this report and start a fresh day?"))return;
    var cash=0,upi=0,tot=0,cnt={};
    S.orders.forEach(function(o){tot+=o.total;if(o.pay==="UPI")upi+=o.total;else cash+=o.total;o.items.forEach(function(x){cnt[x.n]=(cnt[x.n]||0)+x.q})});
    S.reports.push({id:Date.now(),from:S.orders[0].at||Date.now(),to:Date.now(),total:tot,count:S.orders.length,cash:cash,upi:upi,items:cnt});
    S.orders=[];save();renderSales();renderReports();toast("Report saved");
  };
  $("rlist").onclick=function(e){var b=e.target.closest("[data-r]");if(!b)return;if(confirm("Delete this report?")){S.reports=S.reports.filter(function(r){return String(r.id)!==b.dataset.r});save();renderReports()}};
  $("addbtn").onclick=function(){
    var n=$("nn").value.trim(),c=$("nc").value.trim(),v=$("np").value;
    if(!n||!c||v===""||!(Number(v)>=0)){toast("Fill name, price and category");return}
    var g=S.menu.filter(function(x){return x.c.toLowerCase()===c.toLowerCase()})[0];
    if(!g){g={c:c,items:[]};S.menu.push(g)}
    g.items.push({n:n,p:Number(v),note:""});
    save();$("nn").value=$("np").value=$("nc").value="";renderMenu();paint();toast(n+" added");
  };
  $("mlist").onclick=function(e){
    var b=e.target.closest("[data-x]");if(!b)return;var p=b.dataset.x.split("."),m=itemOf(b.dataset.x);
    if(!m||!confirm("Remove "+m.n+"?"))return;
    S.menu[p[0]].items.splice(p[1],1);if(!S.menu[p[0]].items.length)S.menu.splice(p[0],1);
    cart={};save();renderMenu();paint();
  };
  $("mlist").onchange=function(e){var k=e.target.dataset.p;if(k===undefined)return;var m=itemOf(k),v=Number(e.target.value);if(m&&v>=0){m.p=v;save();paint()}};
  document.querySelector("nav").onclick=function(e){
    var b=e.target.closest("[data-t]");if(!b)return;tab=b.dataset.t;
    [].forEach.call(document.querySelectorAll("nav button"),function(x){x.setAttribute("aria-selected",x===b)});
    ["order","sales","reports","menu"].forEach(function(id){$(id).hidden=id!==tab});
    if(tab==="sales")renderSales();if(tab==="reports")renderReports();if(tab==="menu")renderMenu();
    closeSheet();renderBar();window.scrollTo(0,0);
  };
  function wl(){try{if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(function(){})}catch(e){}}
  wl();document.addEventListener("visibilitychange",function(){if(!document.hidden)wl()});
  paint();renderSales();renderReports();renderMenu();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}})}
</script>
</body>
</html>
